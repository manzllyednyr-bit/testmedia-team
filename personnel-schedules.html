<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Schedules - Media Team</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .schedule-tools { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:18px 0; }
        .schedule-tools input, .schedule-tools select { min-height:40px; padding:8px 10px; border:1px solid #d0d5dd; border-radius:7px; background:#fff; font:inherit; }
        .schedule-tools input { min-width:230px; flex:1; }
        .schedule-summary { margin-left:auto; color:#667085; font-size:14px; }
        .schedule-row { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:12px; align-items:center; padding:15px 12px; border-bottom:1px solid #eaecf0; }
        .schedule-row:last-child { border-bottom:0; }
        .schedule-row span { min-width:0; overflow-wrap:anywhere; }
        .details-button { border:0; background:transparent; color:#175c9b; cursor:pointer; padding:0; font:inherit; font-weight:700; }
        .schedule-details-modal { position:fixed; inset:0; z-index:1000; display:none; align-items:center; justify-content:center; padding:20px; background:rgba(16,24,40,.52); }
        .schedule-details-modal.open { display:flex; }
        .details-card { width:min(620px,100%); max-height:90vh; overflow:auto; padding:26px; border-radius:12px; background:#fff; box-shadow:0 20px 50px rgba(0,0,0,.28); }
        .details-heading { display:flex; justify-content:space-between; align-items:flex-start; gap:18px; }
        .details-heading h2 { margin:0; color:#123f6d; }
        .close-details { border:0; background:transparent; color:#667085; cursor:pointer; font-size:28px; line-height:1; }
        .details-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; margin-top:22px; }
        .details-grid div { padding:12px; border-radius:8px; background:#f8fafc; }
        .details-grid dt { margin-bottom:5px; color:#667085; font-size:12px; font-weight:700; }
        .details-grid dd { margin:0; color:#172b4d; overflow-wrap:anywhere; }
        .details-grid .wide { grid-column:1 / -1; }
        @media(max-width:760px) { .schedule-summary{margin-left:0;width:100%}.table-header{display:none}.schedule-row{grid-template-columns:1fr;gap:5px;padding:16px 0}.schedule-row span::before{display:inline-block;width:90px;color:#667085;font-size:12px;font-weight:700}.schedule-row span:nth-child(1)::before{content:'Event';}.schedule-row span:nth-child(2)::before{content:'Date';}.schedule-row span:nth-child(3)::before{content:'Time';}.schedule-row span:nth-child(4)::before{content:'Location';}.schedule-row span:nth-child(5)::before{content:'Details';}.details-grid{grid-template-columns:1fr}.details-grid .wide{grid-column:auto} }
    </style>
</head>
<body>
<div class="dashboard">
    <aside class="sidebar">
        <div class="sidebar-logo"><div class="logo">MT</div><div><h2>Media Team</h2><p>Scheduling System</p></div></div>
        <nav class="navigation"><a href="personnel-dashboard.html" class="nav-item">Dashboard</a><a href="personnel-schedules.html" class="nav-item active">My Schedules</a></nav>
        <div class="sidebar-bottom"><button type="button" id="logoutButton" class="nav-item" style="width:100%; border:0; background:transparent; text-align:left; font:inherit; cursor:pointer;">Logout</button></div>
    </aside>
    <main class="main-content">
        <header class="dashboard-header"><div><h1>My Schedules</h1><p id="scheduleSubtitle">Your assigned media duties.</p></div><div class="admin-profile"><div class="profile-circle" id="profileInitial">P</div><div><strong id="profileName">Personnel</strong><small>Media Personnel</small></div></div></header>
        <section class="dashboard-section">
            <div class="section-header"><div><h2>Assigned Schedules</h2><p>Schedules assigned to you. Click a schedule to see full details.</p></div></div>
            <div class="schedule-tools"><input id="scheduleSearch" type="search" placeholder="Search by event or location"><select id="scheduleFilter" aria-label="Filter schedules"><option value="all">All schedules</option><option value="upcoming">Upcoming only</option><option value="past">Past only</option></select><span id="scheduleSummary" class="schedule-summary"></span></div>
            <div class="schedule-table"><div class="table-header"><span>Event</span><span>Date</span><span>Time</span><span>Location</span><span>Description</span></div><div id="myScheduleList"><div class="empty-state"><div class="empty-icon">📅</div><h3>Loading schedules...</h3></div></div></div>
        </section>
    </main>
</div>
<div class="schedule-details-modal" id="scheduleDetailsModal" role="dialog" aria-modal="true" aria-labelledby="detailsTitle"><section class="details-card"><div class="details-heading"><h2 id="detailsTitle">Schedule Details</h2><button class="close-details" type="button" id="closeDetails" aria-label="Close">×</button></div><div id="detailsContent"></div></section></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>
<script src="personnel-schedules.js"></script>
</body>
</html>
