<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Schedules - Media Team</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="dashboard">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="sidebar-logo">

            <div class="logo">
                MT
            </div>

            <div>
                <h2>Media Team</h2>
                <p>Scheduling System</p>
            </div>

        </div>


        <!-- NAVIGATION -->
        <nav class="navigation">

            <a href="personnel-dashboard.html"
               class="nav-item">
                Dashboard
            </a>

            <a href="personnel-schedules.html"
               class="nav-item active">
                My Schedules
            </a>

        </nav>


        <!-- BOTTOM -->
        <div class="sidebar-bottom">

            <a href="index.html"
               class="nav-item">
                Logout
            </a>

        </div>

    </aside>


    <!-- MAIN CONTENT -->
    <main class="main-content">

        <!-- HEADER -->
        <header class="dashboard-header">

            <div>

                <h1>
                    My Schedules
                </h1>

                <p id="scheduleSubtitle">
                    Your assigned media duties.
                </p>

            </div>


            <div class="admin-profile">

                <div
                    class="profile-circle"
                    id="profileInitial">
                    P
                </div>

                <div>

                    <strong id="profileName">
                        Personnel
                    </strong>

                    <small>
                        Media Personnel
                    </small>

                </div>

            </div>

        </header>


        <!-- SCHEDULE SECTION -->
        <section class="dashboard-section">

            <div class="section-header">

                <div>

                    <h2>
                        Assigned Schedules
                    </h2>

                    <p>
                        Schedules assigned to you.
                    </p>

                </div>

            </div>


            <!-- TABLE -->
            <div class="schedule-table">

                <div class="table-header">

                    <span>
                        Event
                    </span>

                    <span>
                        Date
                    </span>

                    <span>
                        Time
                    </span>

                    <span>
                        Location
                    </span>

                    <span>
                        Description
                    </span>

                </div>


                <div id="myScheduleList">

                    <div class="empty-state">

                        <div class="empty-icon">
                            📅
                        </div>

                        <h3>
                            Loading schedules...
                        </h3>

                    </div>

                </div>

            </div>

        </section>

    </main>

</div>


<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- AUTHENTICATION -->
<script src="script.js"></script>

<!-- MY SCHEDULES -->
<script src="personnel-schedules.js"></script>

</body>

</html>
