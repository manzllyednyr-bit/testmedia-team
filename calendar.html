<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calendar - Media Team</title>

    <link rel="stylesheet" href="style.css">

    <style>

        /* =========================================
           CALENDAR CONTROLS
           ========================================= */

        .calendar-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
        }

        .calendar-controls h2 {
            margin: 0;
            color: #123f6d;
        }

        .calendar-buttons {
            display: flex;
            gap: 10px;
        }


        /* =========================================
           CALENDAR
           ========================================= */

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            overflow: hidden;
        }

        .calendar-day-name {
            background: #f8fafc;
            padding: 15px 10px;
            text-align: center;
            font-weight: bold;
            font-size: 13px;
            color: #667085;
            border-right: 1px solid #e5e7eb;
        }

        .calendar-day {
            min-height: 130px;
            padding: 10px;
            border-top: 1px solid #e5e7eb;
            border-right: 1px solid #e5e7eb;
            background: white;
        }

        .calendar-day.other-month {
            background: #f8fafc;
            color: #98a2b3;
        }

        .calendar-number {
            font-weight: bold;
            margin-bottom: 8px;
        }


        /* =========================================
           CALENDAR EVENTS
           ========================================= */

        .calendar-event {
            background: #e8f1fa;
            color: #123f6d;
            padding: 7px;
            border-radius: 6px;
            margin-bottom: 5px;
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
        }

        .calendar-event:hover {
            transform: translateY(-1px);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        .calendar-event strong {
            display: block;
            margin-bottom: 3px;
        }

        .calendar-event small {
            display: block;
            color: #667085;
            margin-top: 2px;
        }


        /* =========================================
           SCHEDULE DETAILS MODAL
           ========================================= */

        .schedule-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;

            background: rgba(0, 0, 0, 0.45);

            display: flex;
            align-items: center;
            justify-content: center;

            z-index: 9999;

            padding: 20px;
        }

        .schedule-modal {
            background: white;

            width: 100%;
            max-width: 500px;

            border-radius: 14px;

            padding: 30px;

            position: relative;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.2);
        }

        .schedule-modal h2 {
            margin: 0 35px 25px 0;

            color: #123f6d;

            font-size: 24px;
        }

        .schedule-modal-close {
            position: absolute;

            top: 12px;
            right: 18px;

            border: none;

            background: transparent;

            font-size: 30px;

            color: #667085;

            cursor: pointer;
        }

        .schedule-modal-close:hover {
            color: #123f6d;
        }

        .schedule-detail {
            display: flex;
            flex-direction: column;

            gap: 4px;

            padding: 13px 0;

            border-bottom: 1px solid #e5e7eb;
        }

        .schedule-detail strong {
            color: #123f6d;

            font-size: 13px;
        }

        .schedule-detail span {
            color: #475467;

            font-size: 14px;
        }


        /* =========================================
           RESPONSIVE
           ========================================= */

        @media (max-width: 800px) {

            .calendar-controls {
                flex-direction: column;

                align-items: flex-start;

                gap: 15px;
            }

            .calendar-day {
                min-height: 100px;

                padding: 6px;
            }

            .calendar-day-name {
                font-size: 10px;

                padding: 10px 4px;
            }

            .calendar-event {
                font-size: 10px;

                padding: 5px;
            }

            .calendar-event small {
                font-size: 9px;
            }

        }

    </style>

</head>


<body>

<div class="dashboard">


    <!-- =========================================
         SIDEBAR
         ========================================= -->

    <aside class="sidebar">

        <div class="sidebar-logo">

            <div class="logo">
                MT
            </div>

            <div>

                <h2>
                    Media Team
                </h2>

                <p>
                    Scheduling System
                </p>

            </div>

        </div>


        <nav class="navigation">

            <a
                href="admin.html"
                class="nav-item">

                Dashboard

            </a>


            <a
                href="schedules.html"
                class="nav-item">

                Schedules

            </a>


            <a
                href="calendar.html"
                class="nav-item active">

                Calendar

            </a>


            <a
                href="personnel.html"
                class="nav-item">

                Personnel

            </a>


            <a
                href="#"
                class="nav-item">

                Reports

            </a>

        </nav>


        <div class="sidebar-bottom">

            <a
                href="#"
                class="nav-item">

                Settings

            </a>


            <a
                href="index.html"
                class="nav-item">

                Logout

            </a>

        </div>

    </aside>



    <!-- =========================================
         MAIN CONTENT
         ========================================= -->

    <main class="main-content">


        <!-- HEADER -->

        <header class="dashboard-header">

            <div>

                <h1>
                    Calendar
                </h1>

                <p>
                    View media team schedules by date.
                </p>

            </div>


            <div class="admin-profile">

                <div class="profile-circle">
                    A
                </div>

                <div>

                    <strong>
                        Admin
                    </strong>

                    <small>
                        Media Director
                    </small>

                </div>

            </div>

        </header>



        <!-- =========================================
             CALENDAR SECTION
             ========================================= -->

        <section class="dashboard-section">


            <div class="calendar-controls">


                <div class="calendar-buttons">


                    <button
                        type="button"
                        class="primary-button"
                        id="previousMonthBtn">

                        ← Previous

                    </button>


                    <button
                        type="button"
                        class="primary-button"
                        id="todayBtn">

                        Today

                    </button>


                    <button
                        type="button"
                        class="primary-button"
                        id="nextMonthBtn">

                        Next →

                    </button>


                </div>


                <h2 id="currentMonth">
                    Loading...
                </h2>


            </div>



            <!-- DAY NAMES -->

            <div class="calendar-grid">


                <div class="calendar-day-name">
                    Sunday
                </div>


                <div class="calendar-day-name">
                    Monday
                </div>


                <div class="calendar-day-name">
                    Tuesday
                </div>


                <div class="calendar-day-name">
                    Wednesday
                </div>


                <div class="calendar-day-name">
                    Thursday
                </div>


                <div class="calendar-day-name">
                    Friday
                </div>


                <div class="calendar-day-name">
                    Saturday
                </div>


            </div>



            <!-- CALENDAR DAYS -->

            <div
                id="calendarDays"
                class="calendar-grid">

            </div>


        </section>


    </main>


</div>
